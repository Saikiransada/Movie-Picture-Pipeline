name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }} \
            --tag ${{ steps.login-ecr.outputs.registry }}/backend:latest \
            .

      - name: Push backend Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy backend to EKS
        run: |
          kubectl apply -k starter/backend/k8s

          kubectl set image deployment/backend \
            backend=${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}

          kubectl rollout status deployment/backend --timeout=5m